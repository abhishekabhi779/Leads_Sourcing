<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBA Business Search</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      min-height: 100vh;
    }

    header {
      background: #1a1a2e;
      color: #fff;
      padding: 18px 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header span { opacity: 0.45; font-size: 0.82rem; margin-left: 4px; }

    /* ── Search card ── */
    .search-card {
      max-width: 960px;
      margin: 32px auto 0;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.07);
      padding: 26px 30px;
    }
    .search-card h2 { font-size: 0.95rem; font-weight: 600; color: #444; margin-bottom: 18px; }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      align-items: end;
    }
    @media (max-width: 680px) { .fields { grid-template-columns: 1fr 1fr; } }

    .field label {
      display: block;
      font-size: 0.73rem;
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
    }
    .field select, .field input {
      width: 100%;
      padding: 9px 11px;
      border: 1.5px solid #dde1e9;
      border-radius: 7px;
      font-size: 0.875rem;
      background: #fafbfc;
      color: #1a1a2e;
      outline: none;
      transition: border-color 0.15s;
    }
    .field select:focus, .field input:focus { border-color: #4f46e5; background: #fff; }

    .btn-row { display: flex; gap: 8px; align-items: center; grid-column: span 4; margin-top: 4px; }

    .btn-primary {
      padding: 9px 26px; background: #4f46e5; color: #fff;
      border: none; border-radius: 7px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; height: 40px; transition: background 0.15s;
    }
    .btn-primary:hover { background: #4338ca; }

    .btn-ghost {
      padding: 9px 14px; background: transparent; color: #888;
      border: 1.5px solid #dde1e9; border-radius: 7px; font-size: 0.82rem;
      cursor: pointer; height: 40px; transition: all 0.15s;
    }
    .btn-ghost:hover { border-color: #aaa; color: #555; }

    /* ── Enrich toolbar ── */
    .enrich-bar {
      max-width: 960px;
      margin: 16px auto 0;
      background: #ede9fe;
      border: 1.5px solid #c4b5fd;
      border-radius: 10px;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .enrich-bar-left { font-size: 0.875rem; color: #4c1d95; font-weight: 500; }
    .enrich-bar-left strong { font-size: 1rem; }
    .enrich-bar-right { display: flex; gap: 8px; align-items: center; }

    .btn-enrich {
      padding: 8px 20px; background: #7c3aed; color: #fff;
      border: none; border-radius: 7px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .btn-enrich:hover:not(:disabled) { background: #6d28d9; }
    .btn-enrich:disabled { opacity: 0.45; cursor: default; }

    .btn-clear-sel {
      padding: 8px 12px; background: transparent; color: #7c3aed;
      border: 1.5px solid #c4b5fd; border-radius: 7px;
      font-size: 0.82rem; cursor: pointer;
    }
    .btn-clear-sel:hover { background: #f5f3ff; }

    /* ── Results ── */
    .results-section { max-width: 960px; margin: 20px auto 56px; }

    .results-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; padding: 0 2px;
    }
    .results-count { font-size: 0.85rem; color: #666; }
    .results-count strong { color: #1a1a2e; }

    table {
      width: 100%; border-collapse: collapse; background: #fff;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); font-size: 0.85rem;
    }
    thead th {
      background: #1a1a2e; color: #fff; text-align: left;
      padding: 11px 14px; font-weight: 600;
      font-size: 0.73rem; text-transform: uppercase; letter-spacing: 0.04em;
    }
    thead th:first-child { width: 40px; text-align: center; }

    tbody tr { border-bottom: 1px solid #f0f2f5; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8f9ff; }
    tbody tr.selected { background: #f5f3ff; }

    tbody td { padding: 11px 14px; vertical-align: middle; }
    tbody td:first-child { text-align: center; }

    input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; accent-color: #7c3aed; }

    .biz-name { font-weight: 600; color: #1a1a2e; }
    .biz-addr { color: #888; font-size: 0.78rem; margin-top: 2px; }

    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 99px;
      font-size: 0.73rem; font-weight: 500;
      background: #ede9fe; color: #5b21b6;
    }

    /* ── Enriched result columns ── */
    .website-link { color: #4f46e5; text-decoration: none; font-size: 0.82rem; }
    .website-link:hover { text-decoration: underline; }
    .maps-link { color: #059669; font-size: 0.78rem; text-decoration: none; }
    .maps-link:hover { text-decoration: underline; }
    .enriching-spinner { color: #888; font-size: 0.78rem; font-style: italic; }

    /* ── Pagination ── */
    .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 18px; }
    .pagination button {
      padding: 6px 13px; border: 1.5px solid #dde1e9; background: #fff;
      border-radius: 6px; font-size: 0.82rem; cursor: pointer; transition: all 0.15s;
    }
    .pagination button:hover:not(:disabled) { border-color: #4f46e5; color: #4f46e5; }
    .pagination button.active { background: #4f46e5; color: #fff; border-color: #4f46e5; }
    .pagination button:disabled { opacity: 0.35; cursor: default; }

    /* ── States ── */
    .empty-state {
      text-align: center; padding: 56px 20px; color: #888;
      background: #fff; border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    .empty-state .icon { font-size: 2.2rem; margin-bottom: 10px; }

    .loading { text-align: center; padding: 48px; color: #888; font-size: 0.9rem; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: #1a1a2e; color: #fff; padding: 10px 22px;
      border-radius: 8px; font-size: 0.875rem; font-weight: 500;
      opacity: 0; pointer-events: none; transition: opacity 0.25s;
      z-index: 999;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>SBA Business Search</h1>
  <span>PPP Loan Database</span>
</header>

<!-- Search form -->
<div class="search-card">
  <h2>Find businesses by industry and location</h2>
  <div class="fields">
    <div class="field">
      <label>Industry</label>
      <select id="sel-industry"><option value="">All industries</option></select>
    </div>
    <div class="field">
      <label>State</label>
      <select id="sel-state"><option value="">All states</option></select>
    </div>
    <div class="field">
      <label>City</label>
      <input type="text" id="inp-city" placeholder="e.g. Brooklyn">
    </div>
    <div class="field">
      <label>Business name</label>
      <input type="text" id="inp-name" placeholder="e.g. Pizza">
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-search">Search</button>
      <button class="btn-ghost" id="btn-clear">Clear</button>
    </div>
  </div>
</div>

<!-- Enrich toolbar (shown when rows are selected) -->
<div class="enrich-bar" id="enrich-bar" style="display:none">
  <div class="enrich-bar-left">
    <strong id="sel-count">0</strong> businesses selected
    &nbsp;·&nbsp; Finds website (Google Places) → scrapes email &amp; phone from site
  </div>
  <div class="enrich-bar-right">
    <button class="btn-clear-sel" id="btn-clear-sel">Clear selection</button>
    <button class="btn-enrich" id="btn-enrich">⚡ Find Contacts &amp; Export CSV</button>
  </div>
</div>

<!-- Results -->
<div class="results-section" id="results-section" style="display:none">
  <div class="results-meta">
    <div class="results-count" id="results-count"></div>
    <div id="page-info" style="font-size:0.82rem;color:#888;"></div>
  </div>
  <div id="results-container"></div>
  <div class="pagination" id="pagination"></div>
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let currentPage = 1;
let selectedRows = {};   // key: borrower_name+city, value: row object
const MAX_SELECT = 10;

// ── Filters ────────────────────────────────────────────────────────────────
async function loadFilters() {
  const [indRes, stRes] = await Promise.all([
    fetch("/api/industries").then(r => r.json()),
    fetch("/api/states").then(r => r.json()),
  ]);

  const indSel = document.getElementById("sel-industry");
  indRes.forEach(({ name, count }) => {
    const opt = document.createElement("option");
    opt.value = name;
    opt.textContent = `${name} (${count.toLocaleString()})`;
    indSel.appendChild(opt);
  });

  const stSel = document.getElementById("sel-state");
  stRes.forEach(st => {
    const opt = document.createElement("option");
    opt.value = st; opt.textContent = st;
    stSel.appendChild(opt);
  });
}

// ── Search ─────────────────────────────────────────────────────────────────
function buildParams(page) {
  const p = new URLSearchParams();
  const industry = document.getElementById("sel-industry").value;
  const state    = document.getElementById("sel-state").value;
  const city     = document.getElementById("inp-city").value.trim();
  const name     = document.getElementById("inp-name").value.trim();
  if (industry) p.set("industry", industry);
  if (state)    p.set("state", state);
  if (city)     p.set("city", city);
  if (name)     p.set("name", name);
  p.set("page", page);
  return p;
}

async function search(page) {
  currentPage = page;
  const section   = document.getElementById("results-section");
  const container = document.getElementById("results-container");
  section.style.display = "block";
  container.innerHTML = '<div class="loading">Searching...</div>';
  document.getElementById("pagination").innerHTML = "";
  document.getElementById("results-count").textContent = "";

  const data = await fetch(`/api/search?${buildParams(page)}`).then(r => r.json());
  renderResults(data);
}

// ── Render results ─────────────────────────────────────────────────────────
function rowKey(r) {
  return (r.borrower_name + "|" + r.borrower_city + "|" + r.borrower_state).toLowerCase();
}

function renderResults(data) {
  const container = document.getElementById("results-container");
  document.getElementById("results-count").innerHTML =
    `<strong>${data.total.toLocaleString()}</strong> businesses found`;
  document.getElementById("page-info").textContent =
    data.total_pages > 1 ? `Page ${data.page} of ${data.total_pages}` : "";

  if (!data.results.length) {
    container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No businesses found. Try adjusting your filters.</p></div>`;
    return;
  }

  const rows = data.results.map(r => {
    const key      = rowKey(r);
    const checked  = selectedRows[key] ? "checked" : "";
    const selClass = selectedRows[key] ? "selected" : "";
    return `
      <tr class="${selClass}" data-key="${esc(key)}">
        <td><input type="checkbox" class="row-cb" data-key="${esc(key)}" ${checked}></td>
        <td>
          <div class="biz-name">${esc(r.borrower_name)}</div>
          <div class="biz-addr">${esc(r.borrower_address || "")}</div>
        </td>
        <td>${esc(r.borrower_city || "")}</td>
        <td>${esc(r.borrower_state || "")}</td>
        <td><span class="tag">${esc(r.industry || "")}</span></td>
        <td style="color:#666;font-size:0.78rem;">${esc(r.naics_code || "")}</td>
        <td style="text-align:right;">${r.jobs_reported ?? "—"}</td>
      </tr>`;
  });

  // Store current page rows for checkbox lookup
  window._currentRows = {};
  data.results.forEach(r => { window._currentRows[rowKey(r)] = r; });

  container.innerHTML = `
    <table>
      <thead>
        <tr>
          <th><input type="checkbox" id="cb-all" title="Select / deselect page"></th>
          <th>Business Name</th>
          <th>City</th>
          <th>State</th>
          <th>Industry</th>
          <th>NAICS</th>
          <th style="text-align:right;">Jobs</th>
        </tr>
      </thead>
      <tbody>${rows.join("")}</tbody>
    </table>`;

  // Select-all checkbox
  document.getElementById("cb-all").addEventListener("change", function() {
    const cbs = document.querySelectorAll(".row-cb");
    cbs.forEach(cb => {
      const key = cb.dataset.key;
      if (this.checked) {
        if (Object.keys(selectedRows).length >= MAX_SELECT) return;
        selectedRows[key] = window._currentRows[key];
        cb.checked = true;
        cb.closest("tr").classList.add("selected");
      } else {
        delete selectedRows[key];
        cb.checked = false;
        cb.closest("tr").classList.remove("selected");
      }
    });
    updateEnrichBar();
  });

  // Individual checkboxes
  document.querySelectorAll(".row-cb").forEach(cb => {
    cb.addEventListener("change", function() {
      const key = this.dataset.key;
      if (this.checked) {
        if (Object.keys(selectedRows).length >= MAX_SELECT) {
          this.checked = false;
          toast(`Max ${MAX_SELECT} businesses per batch`);
          return;
        }
        selectedRows[key] = window._currentRows[key];
        this.closest("tr").classList.add("selected");
      } else {
        delete selectedRows[key];
        this.closest("tr").classList.remove("selected");
      }
      updateEnrichBar();
    });
  });

  renderPagination(data.page, data.total_pages);
}

// ── Enrich bar ─────────────────────────────────────────────────────────────
function updateEnrichBar() {
  const count = Object.keys(selectedRows).length;
  const bar   = document.getElementById("enrich-bar");
  document.getElementById("sel-count").textContent = count;
  bar.style.display = count > 0 ? "flex" : "none";
  document.getElementById("btn-enrich").disabled = count === 0;
}

document.getElementById("btn-clear-sel").addEventListener("click", () => {
  selectedRows = {};
  document.querySelectorAll(".row-cb").forEach(cb => {
    cb.checked = false;
    cb.closest("tr").classList.remove("selected");
  });
  const all = document.getElementById("cb-all");
  if (all) all.checked = false;
  updateEnrichBar();
});

// ── Enrich + Export ────────────────────────────────────────────────────────
document.getElementById("btn-enrich").addEventListener("click", async () => {
  const businesses = Object.values(selectedRows);
  const btn = document.getElementById("btn-enrich");
  btn.disabled = true;
  btn.textContent = "⏳ Looking up websites...";

  try {
    const res = await fetch("/api/enrich", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ businesses }),
    });
    const data = await res.json();

    if (data.error) { toast("Error: " + data.error); return; }

    // Show enriched data in the table rows
    data.results.forEach(r => {
      const key = rowKey(r);
      const row = document.querySelector(`tr[data-key="${CSS.escape(key)}"]`);
      if (!row) return;
      const lastTd = row.querySelector("td:last-child");
      let html = "";
      if (r.website)       html += `<a class="website-link" href="${esc(r.website)}" target="_blank">🌐 Website</a><br>`;
      if (r.email)         html += `<span style="color:#059669;font-size:0.78rem;">✉️ ${esc(r.email)}</span><br>`;
      if (r.contact_name)  html += `<span style="color:#b45309;font-size:0.78rem;">👤 ${esc(r.contact_name)}</span><br>`;
      if (r.phone)         html += `<span style="color:#555;font-size:0.78rem;">📞 ${esc(r.phone)}</span><br>`;
      if (r.maps_url)      html += `<a class="maps-link" href="${esc(r.maps_url)}" target="_blank">📍 Maps</a>`;
      if (!r.website && !r.phone && !r.email)
        html = `<span style="color:#bbb;font-size:0.78rem;">Not found</span>`;
      lastTd.innerHTML = html;
    });

    // Download CSV
    const csvRes = await fetch("/api/export-csv", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rows: data.results }),
    });
    const blob = await csvRes.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href     = url;
    a.download = "sba_enriched_leads.csv";
    a.click();
    URL.revokeObjectURL(url);

    toast(`✅ Exported ${data.results.length} enriched businesses`);
  } catch (e) {
    toast("Something went wrong — check console");
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = "⚡ Enrich & Export CSV";
  }
});

// ── Pagination ─────────────────────────────────────────────────────────────
function renderPagination(page, total) {
  const el = document.getElementById("pagination");
  if (total <= 1) { el.innerHTML = ""; return; }

  let html = `<button ${page===1?"disabled":""} onclick="search(${page-1})">&#8592; Prev</button>`;
  const range = [];
  for (let i = Math.max(1, page-2); i <= Math.min(total, page+2); i++) range.push(i);
  if (range[0] > 1) html += `<button onclick="search(1)">1</button>${range[0]>2?'<button disabled>…</button>':""}`;
  range.forEach(i => { html += `<button class="${i===page?"active":""}" onclick="search(${i})">${i}</button>`; });
  if (range.at(-1) < total) html += `${range.at(-1)<total-1?'<button disabled>…</button>':""}<button onclick="search(${total})">${total}</button>`;
  html += `<button ${page===total?"disabled":""} onclick="search(${page+1})">Next &#8594;</button>`;
  el.innerHTML = html;
}

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 3000);
}

// ── Wire up controls ───────────────────────────────────────────────────────
document.getElementById("btn-search").addEventListener("click", () => {
  selectedRows = {};
  updateEnrichBar();
  search(1);
});

document.getElementById("btn-clear").addEventListener("click", () => {
  document.getElementById("sel-industry").value = "";
  document.getElementById("sel-state").value = "";
  document.getElementById("inp-city").value = "";
  document.getElementById("inp-name").value = "";
  document.getElementById("results-section").style.display = "none";
  document.getElementById("enrich-bar").style.display = "none";
  selectedRows = {};
});

["inp-city","inp-name"].forEach(id => {
  document.getElementById(id).addEventListener("keydown", e => {
    if (e.key === "Enter") { selectedRows = {}; updateEnrichBar(); search(1); }
  });
});

loadFilters();
</script>
</body>
</html>
